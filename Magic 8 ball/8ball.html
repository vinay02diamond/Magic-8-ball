<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic 8-Ball</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #282c34;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .ball {
            width: 150px;
            height: 150px;
            background: black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease-in-out;
        }
        .ball:hover {
            transform: scale(1.1);
        }
        input {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            outline: none;
            text-align: center;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #ff9800;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #e68900;
        }
    </style>
</head>
<body>
    <h1>Magic 8-Ball</h1>
    <p>Enter your name:</p>
    <input type="text" id="userName" placeholder="Your name...">
    <p>Ask a Yes/No question:</p>
    <input type="text" id="question" placeholder="Type your question...">
    <button onclick="askQuestion()">Ask</button>
    <div class="ball" id="answer">8</div>

    <script>
        function askQuestion() {
            let userName = document.getElementById("userName").value.trim();
            let userQuestion = document.getElementById("question").value.trim();
            
            if (!userQuestion) {
                document.getElementById("answer").innerText = "Ask a question!";
                return;
            }

            let greeting = userName ? `Hello, ${userName}!` : "Hello!";
            console.log(`${greeting} ${userName} has asked - ${userQuestion}`);

            let randomNumber = Math.floor(Math.random() * 8);
            let eightBall = "";

            switch (randomNumber) {
                case 0: eightBall = "It is certain."; break;
                case 1: eightBall = "It is decidedly so."; break;
                case 2: eightBall = "Reply hazy try again."; break;
                case 3: eightBall = "Cannot predict now."; break;
                case 4: eightBall = "Do not count on it."; break;
                case 5: eightBall = "My sources say no."; break;
                case 6: eightBall = "Outlook not so good."; break;
                case 7: eightBall = "Signs point to yes."; break;
            }

            document.getElementById("answer").innerText = eightBall;
        }
    </script>
</body>
</html>
